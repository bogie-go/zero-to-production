<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ecommerce</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1c1b19; --muted: #6a675f; --line: #e4e1d8; --bg: #f8f6f1; --panel: #fffdf9;
        --accent: #c0392b; --accent-soft: #fbe9e6; --glow: #bfe8f2;
      }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #ecebe7; --muted: #9c9a93; --line: #2e2d2a; --bg: #151514; --panel: #1d1d1b;
                --accent: #ea6e5f; --accent-soft: #3a2320; --glow: #1f3a42; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
             font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

      header { border-bottom: 1px solid var(--line); }
      header .wrap { max-width: 72rem; margin: 0 auto; padding: 1.1rem 1.5rem; display: flex; align-items: center; gap: .6rem; }
      header .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
      header .tag { color: var(--muted); font-size: .85rem; flex: 1; }
      header .cart-link { color: inherit; text-decoration: none; font-size: .9rem; padding: .4rem .75rem;
                           border-radius: .5rem; background: var(--panel); border: 1px solid var(--line); }
      header .cart-link:hover { border-color: var(--accent); }

      main { max-width: 72rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
      h1 { font-size: clamp(1.5rem, 3vw, 1.9rem); margin: 0 0 .3rem; letter-spacing: -.01em; }
      p.lead { color: var(--muted); margin: 0 0 2rem; }

      .state { padding: 3rem 1rem; text-align: center; color: var(--muted); }

      .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; overflow: hidden;
              display: flex; flex-direction: column; color: inherit; text-decoration: none; }
      .card:hover { border-color: var(--accent); }
      .card .thumb { aspect-ratio: 3 / 2; background: var(--accent-soft); position: relative; overflow: hidden; }
      .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .body { padding: 1rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
      .card h2 { font-size: 1.02rem; margin: 0; letter-spacing: -.005em; }
      .card .desc { color: var(--muted); font-size: .88rem; margin: 0; flex: 1;
                    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: .4rem; }
      .card .price { font-weight: 700; font-size: 1.05rem; }
      .card .stock { font-size: .78rem; padding: .2rem .55rem; border-radius: 1rem; background: var(--accent-soft); color: var(--accent); }
      .card .stock.out { background: var(--line); color: var(--muted); }

      footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
      footer .wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem; }
      footer code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel);
                    border: 1px solid var(--line); border-radius: .3rem; padding: .05rem .35rem; }
    </style>
  </head>
  <body x-data="shop()" x-init="load(); loadCartCount()">
    <header>
      <div class="wrap">
        <span class="brand">Ecommerce</span>
        <span class="tag">built with Bogie</span>
        <a class="cart-link" href="/cart.html" x-text="'Cart (' + cartCount + ')'"></a>
      </div>
    </header>

    <main>
      <h1>Products</h1>
      <p class="lead">Everything in the catalog right now.</p>

      <p class="state" x-show="loading">Loading products&hellip;</p>
      <p class="state" x-show="!loading && error" x-text="error"></p>
      <p class="state" x-show="!loading && !error && products.length === 0">No products yet.</p>

      <div class="grid" x-show="!loading && !error && products.length > 0">
        <template x-for="p in products" :key="p.id">
          <a class="card" :href="'/product.html?id=' + p.id">
            <div class="thumb">
              <img :src="p.image_url" :alt="p.name" loading="lazy">
            </div>
            <div class="body">
              <h2 x-text="p.name"></h2>
              <p class="desc" x-text="p.description"></p>
              <div class="meta">
                <span class="price" x-text="formatPrice(p.price_cents)"></span>
                <span class="stock" :class="{ out: p.stock === 0 }" x-text="p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'"></span>
              </div>
            </div>
          </a>
        </template>
      </div>
    </main>

    <footer>
      <div class="wrap">This page fetches <code>GET /products</code> with Alpine.js, no build step. See <code>public/index.html</code>.</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    <script>
      // ensureGuestSession mints a guest cart's bearer token on first need,
      // via POST /guest_sessions, and saves it for next time. Called lazily,
      // from inside cartFetch, never on page load.
      async function ensureGuestSession() {
        const res = await fetch('/guest_sessions', { method: 'POST' });
        const body = await res.json();
        try { localStorage.setItem('cartToken', body.token); } catch (e) {}
        return body.token;
      }

      // cartFetch wraps fetch for /cart and /cart_items: always sends the
      // saved cart token as a normal bearer token, minting one first if
      // there isn't one yet. Callers never think about the token at all.
      async function cartFetch(url, options = {}) {
        let token = '';
        try { token = localStorage.getItem('cartToken') || ''; } catch (e) {}
        if (!token) token = await ensureGuestSession();
        const headers = new Headers(options.headers || {});
        headers.set('Authorization', 'Bearer ' + token);
        return fetch(url, { ...options, headers });
      }

      function shop() {
        return {
          products: [],
          loading: true,
          error: null,
          cartCount: 0,
          async load() {
            try {
              const res = await fetch('/products');
              if (!res.ok) throw new Error('status ' + res.status);
              const data = await res.json();
              this.products = data.products || [];
            } catch (e) {
              this.error = 'Could not load products: ' + e.message;
            } finally {
              this.loading = false;
            }
          },
          async loadCartCount() {
            try {
              const res = await cartFetch('/cart');
              const data = await res.json();
              this.cartCount = (data.items || []).reduce((n, i) => n + i.quantity, 0);
            } catch (e) {
              // The cart badge is a nicety; a failure here is not worth a
              // page-level error state.
            }
          },
          formatPrice(cents) {
            return '$' + (cents / 100).toFixed(2);
          },
        };
      }
    </script>
  </body>
</html>
