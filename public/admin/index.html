<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body x-data="adminPage()" x-init="load()">
    <div class="shell" x-show="!loading && !error">
      <aside class="sidebar">
        <a class="brand" href="/admin/">Ecommerce<small>admin</small></a>
        <nav>
          <template x-for="link in links" :key="link.href">
            <a :href="link.soon ? null : link.href" :class="{ active: isActive(link), soon: link.soon }">
              <span x-text="link.label"></span><em x-show="link.soon">soon</em>
            </a>
          </template>
          <a href="/">&larr; Back to the shop</a>
        </nav>
        <div class="who">
          <span x-text="email"></span>
          <div><button @click="logout()">Log out</button></div>
        </div>
      </aside>

      <main class="content">
        <h1>Dashboard</h1>
        <p class="note">Manage the shop. Each section arrives as its page is built.</p>
        <div class="cards">
          <div class="card">
            <h2><a href="/admin/products.html" style="color:inherit">Products</a></h2>
            <p x-text="productCount + ' in the catalog'"></p>
          </div>
          <div class="card soon"><h2>Categories</h2><p>Coming soon</p></div>
          <div class="card soon"><h2>Price rules</h2><p>Coming soon</p></div>
        </div>
      </main>
    </div>

    <p class="state" x-show="loading">Checking access&hellip;</p>
    <p class="state" x-show="!loading && error" x-text="error"></p>

    <script src="/admin/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    <script>
      function adminPage() {
        return {
          ...adminShell(),
          productCount: 0,
          async load() {
            if (!(await this.guard())) return;
            try {
              const res = await this.api('/admin/products');
              if (!res.ok) throw new Error('status ' + res.status);
              this.productCount = ((await res.json()).products || []).length;
            } catch (e) {
              this.error = 'Could not load the admin area: ' + e.message;
            } finally {
              this.loading = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
