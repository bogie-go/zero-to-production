# Kamal 2. This file is the one deployed environment: a bare `kamal deploy`
# targets it. A second environment would be a Kamal destination
# (config/deploy.<name>.yml overlaying this, with .kamal/secrets.<name>).
service: ecommerce

# Where the image is pushed. Docker Hub by default: `username/ecommerce`.
# For another registry add `registry: server:` below.
image: roonglit/bogie-depot

servers:
  web:
    - depot.bogie-go.com
  # The worker is this same image started with a different argument, so a
  # web container and a job container cannot be built from different
  # commits. Same host as web until the queue needs its own.
  job:
    hosts:
      - depot.bogie-go.com
    cmd: worker

proxy:
  ssl: true
  hosts:
    - depot.bogie-go.com
  # The app listens on 8080, not Kamal's default of 3000.
  app_port: 8080
  # Kamal's default probe is /up, which this service does not have. The proxy
  # moves traffic to a new container only after this answers 200, so it asks
  # the READINESS probe: it reaches the database, and a release that cannot
  # never replaces the one that can (the old container keeps serving and the
  # deploy fails). /healthz, which touches nothing, is for "is the process
  # alive" and is what the `status` alias below asks.
  healthcheck:
    path: /readyz
    interval: 3
    timeout: 3
  # Bounds the wait for a RESPONSE. Nothing on an API path should approach
  # this; if a timeout appears here, the question is what started blocking,
  # not what to raise.
  response_timeout: 30

ssh:
  user: roonglit

registry:
  username: roonglit
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    # The key that opens config/credentials/production.yml.enc, which is baked
    # into the image. The key never is: .dockerignore keeps every *.key out
    # of the build context, so an image cannot carry both halves. Its value
    # comes from .kamal/secrets.
    - ECOMMERCE_MASTER_KEY
  clear:
    # ECOMMERCE_ENV is a closed set of three (development, test, production);
    # a deployed system is production. Its credentials default to the same
    # name, config/credentials/production.yml.enc.
    ECOMMERCE_ENV: production
    SERVER_ADDR: ":8080"

builder:
  arch: amd64

# SAFE UPDATES. A new container boots beside the old one, applies any pending
# migration (under a database lock, so the web and job containers starting
# together cannot both run it), and takes traffic only once /readyz is green.
# deploy_timeout is how long that may take; drain_timeout is how long the old
# container may finish its in-flight requests, and must exceed
# server.shutdown_grace (10s) or the proxy cuts them off first.
deploy_timeout: 60
drain_timeout: 30

# The database and the mail catcher run next to the app, as accessories: one
# VM, no managed services, which is what a small deployment needs. They
# live on Kamal's docker network, so database.url and smtp.address in
# config/credentials/production.yml.enc name them by container name
# (ecommerce-db, ecommerce-mailpit) and nothing is published to the internet.
# To use a Postgres that already exists instead, delete the db accessory and
# point database.url at that server, as a SEPARATE database on it.
#
# The schema is applied by the app container itself at boot, from the
# migrations in the binary, so the database only has to exist (Postgres
# creates POSTGRES_DB on first start).
accessories:
  db:
    image: postgres:18
    roles: [web]
    env:
      clear:
        POSTGRES_USER: ecommerce
        POSTGRES_DB: ecommerce_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql
  # Catches every email the app sends instead of delivering it. Its inbox is
  # at port 8025 on the VM's loopback: ssh -L 8025:localhost:8025 user@host.
  # Replace with a real SMTP provider (smtp.address in the credentials, and
  # delete this accessory) before sending to real customers.
  mailpit:
    image: axllent/mailpit:latest
    roles: [web]
    port: "127.0.0.1:8025:8025"

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
  status: app exec --reuse "wget -qO- http://localhost:8080/healthz"
  ready: app exec --reuse "wget -qO- http://localhost:8080/readyz"
